<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff6b8a" />
  <meta name="description" content="A little question for Sandra, from someone who cares about her." />
  <title>Sandra, will you be my girlfriend?</title>
  <style>
    :root {
      --pink: #d46f81;
      --pink-dark: #b9546b;
      --cream: #fff9f6;
      --text: #49363a;
      --shadow: 0 24px 70px rgba(94, 57, 62, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.9), transparent 42%),
        radial-gradient(ellipse at 88% 88%, rgba(235,195,191,.42), transparent 38%),
        linear-gradient(145deg, #f7e9e4, #fffaf6 52%, #f2dfdc);
    }

    .background-hearts,
    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .background-heart {
      position: absolute;
      opacity: 0.12;
      animation: float 8s ease-in-out infinite;
      user-select: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-24px) rotate(8deg); }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 600px);
      min-height: 410px;
      padding: 56px 36px 34px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 28px;
      background: rgba(255, 252, 249, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .emoji {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      border-radius: 24px;
      background: linear-gradient(145deg, #fff, #f6e7e3);
      box-shadow: 0 10px 28px rgba(185, 84, 107, 0.12);
      font-size: 38px;
      transform: rotate(-3deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6.6vw, 60px);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 20px auto 0;
      max-width: 440px;
      color: #80676b;
      font-size: clamp(15px, 2.5vw, 18px);
      line-height: 1.6;
    }

    .button-area {
      position: relative;
      width: min(100%, 420px);
      height: 152px;
      margin: 30px auto 0;
      touch-action: manipulation;
    }

    button {
      position: absolute;
      top: 0;
      min-width: 148px;
      height: 56px;
      padding: 0 26px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        background 160ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      left: calc(50% - 157px);
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 12px 28px rgba(233, 64, 104, 0.3);
    }

    #yesBtn:hover {
      box-shadow: 0 16px 34px rgba(233, 64, 104, 0.38);
    }

    #yesBtn:active {
      filter: brightness(0.96);
    }

    #noBtn {
      left: calc(50% + 9px);
      color: #80676b;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(128, 103, 107, 0.16);
      box-shadow: 0 8px 20px rgba(73, 54, 58, 0.08);
      transition: left 110ms ease-out, top 110ms ease-out, transform 110ms ease-out;
    }

    .hint {
      margin-top: -8px;
      color: #a27f8b;
      font-size: 13px;
    }

    .result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-items: center;
      padding: 24px;
      background: rgba(255, 242, 246, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .result.show {
      display: grid;
      animation: fadeIn 320ms ease both;
    }

    .result-card {
      width: min(92vw, 560px);
      padding: 54px 30px;
      border-radius: 32px;
      background: white;
      box-shadow: var(--shadow);
      text-align: center;
      animation: popIn 560ms cubic-bezier(.18, .89, .32, 1.28) both;
    }

    .result-card .big-heart {
      font-size: 82px;
      animation: heartbeat 900ms ease-in-out infinite;
    }

    .result-card h2 {
      margin: 18px 0 10px;
      font-size: clamp(38px, 8vw, 64px);
      letter-spacing: -0.05em;
    }

    .result-card p {
      margin: 0;
      color: #7c5866;
      font-size: 18px;
    }

    .restart {
      position: static;
      margin-top: 28px;
      min-width: 150px;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 12px 28px rgba(233, 64, 104, 0.28);
    }

    .flying-heart {
      position: absolute;
      bottom: -80px;
      font-size: 28px;
      animation: flyUp linear forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.7) rotate(-4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.16); }
      55% { transform: scale(1.04); }
    }

    @keyframes flyUp {
      from {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      12% { opacity: 1; }
      to {
        transform: translateY(-120vh) rotate(540deg) scale(1.45);
        opacity: 0;
      }
    }

    @media (max-width: 560px) {
      .card {
      min-height: 400px;
      padding: 42px 20px 26px;
        border-radius: 26px;
      }

      button {
        min-width: 148px;
      }

      .button-area {
        width: 100%;
        height: 152px;
        margin-top: 24px;
      }

      #yesBtn {
        left: calc(50% - 119px);
        min-width: 132px;
        padding: 0 16px;
      }

      #noBtn {
        left: calc(50% + 23px);
        min-width: 96px;
        padding: 0 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="background-hearts" aria-hidden="true">
    <span class="background-heart" style="left:8%;top:12%;font-size:52px;animation-delay:-1s;">♥</span>
    <span class="background-heart" style="left:18%;top:76%;font-size:34px;animation-delay:-5s;">♥</span>
    <span class="background-heart" style="left:78%;top:16%;font-size:42px;animation-delay:-3s;">♥</span>
    <span class="background-heart" style="left:88%;top:70%;font-size:64px;animation-delay:-6s;">♥</span>
    <span class="background-heart" style="left:55%;top:5%;font-size:24px;animation-delay:-2s;">♥</span>
  </div>

  <main class="card">
    <div class="emoji" aria-hidden="true">💌</div>
    <h1>Sandra, will you be my girlfriend?</h1>
    <p class="subtitle">
      I really like you, and I’d love to make more memories together.<br />
      What do you think?
    </p>

    <div class="button-area" id="buttonArea">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button" aria-label="No">No</button>
    </div>

    <p class="hint">With love, just for you.</p>
  </main>

  <section class="result" id="result" aria-live="polite">
    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <div class="result-card">
      <div class="big-heart" aria-hidden="true">💖</div>
      <h2>You are my girlfriend now.</h2>
      <p>I will love you a lot. 💖</p>
    </div>
  </section>

  <script>
    const buttonArea = document.getElementById("buttonArea");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const celebration = document.getElementById("celebration");

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function moveNoButton(pointerX, pointerY) {
      const areaRect = buttonArea.getBoundingClientRect();
      const buttonRect = noBtn.getBoundingClientRect();
      const maxX = Math.max(0, areaRect.width - buttonRect.width);
      const maxY = Math.max(58, areaRect.height - buttonRect.height);
      let x = Math.random() * maxX;
      let y = Math.random() * maxY;

      if (typeof pointerX === "number" && typeof pointerY === "number") {
        const localX = pointerX - areaRect.left;
        const localY = pointerY - areaRect.top;
        const centerX = buttonRect.left - areaRect.left + buttonRect.width / 2;
        const centerY = buttonRect.top - areaRect.top + buttonRect.height / 2;
        const dx = centerX - localX;
        const dy = centerY - localY;
        const length = Math.hypot(dx, dy) || 1;
        x = centerX + (dx / length) * 130 - buttonRect.width / 2;
        y = centerY + (dy / length) * 72 - buttonRect.height / 2;
      }

      noBtn.style.left = `${clamp(x, 0, maxX)}px`;
      noBtn.style.top = `${clamp(y, 58, maxY)}px`;
      noBtn.style.position = "absolute";
      noBtn.style.right = "auto";
      noBtn.style.transform = `rotate(${(Math.random() - 0.5) * 12}deg)`;
    }

    function isPointerNearNoButton(clientX, clientY) {
      const rect = noBtn.getBoundingClientRect();
      const padding = 48;
      return clientX >= rect.left - padding && clientX <= rect.right + padding &&
        clientY >= rect.top - padding && clientY <= rect.bottom + padding;
    }

    document.addEventListener("pointermove", (event) => {
      if (event.pointerType === "mouse" && isPointerNearNoButton(event.clientX, event.clientY)) {
        moveNoButton(event.clientX, event.clientY);
      }
    });

    noBtn.addEventListener("pointerenter", (event) => moveNoButton(event.clientX, event.clientY));
    noBtn.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      moveNoButton(event.clientX, event.clientY);
    });
    noBtn.addEventListener("click", (event) => {
      event.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener("focus", () => {
      moveNoButton();
      yesBtn.focus();
    });

    function launchHearts() {
      celebration.innerHTML = "";

      for (let i = 0; i < 38; i += 1) {
        const heart = document.createElement("span");
        heart.className = "flying-heart";
        heart.textContent = Math.random() > 0.25 ? "💖" : "💕";
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${3.2 + Math.random() * 3.4}s`;
        heart.style.animationDelay = `${Math.random() * 1.6}s`;
        heart.style.fontSize = `${18 + Math.random() * 34}px`;
        celebration.appendChild(heart);
      }
    }

    yesBtn.addEventListener("click", () => {
      result.classList.add("show");
      launchHearts();
    });

    window.addEventListener("resize", () => noBtn.removeAttribute("style"));
  </script>
</body>
</html>
